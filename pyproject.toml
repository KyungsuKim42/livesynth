[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "livesynth"
version = "0.1.0"
description = "LiveSynth: a real-time streaming neural instrument with zero-shot instrument cloning and text-to-instrument"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kyungsu Kim" }, { name = "Yejin Kim" }, { name = "Kyogu Lee" },
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pretty_midi>=0.2.10",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "laion_clap>=1.1.4",
]

[project.optional-dependencies]
live = ["sounddevice>=0.4.6", "mido>=1.3", "python-rtmidi>=1.5", "PyQt6>=6.5"]
mlx = ["mlx>=0.18"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/KyungsuKim42/livesynth"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
