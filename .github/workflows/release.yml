# Publish to PyPI when a version tag (v*) is pushed, via PyPI Trusted Publishing:
# no API token is stored anywhere; PyPI trusts this workflow through GitHub OIDC.
# One-time setup on pypi.org: project "livesynth" -> Manage -> Publishing -> add a
# GitHub publisher (owner KyungsuKim42, repository livesynth, workflow release.yml,
# environment left empty: deployment environments need a paid plan on private repos).
# Release: set the version in pyproject.toml, then push a tag "v<version>".
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Point the README at the tagged repository for the PyPI page
        run: python .github/pypi_readme.py
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
